name: Surgical refactor regression guard
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .agents/skills/surgical-refactor/tooling/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - name: Install pinned project tools
        run: npm run refactor:setup
      - name: Tests, AST, static analysis and no-new-dead-code guard
        run: npm run refactor:verify
      - name: Focused mutation gate
        run: npm run refactor:mutation
      - name: Produce evidence report
        if: always()
        run: node .agents/skills/surgical-refactor/scripts/refactor.mjs report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: surgical-refactor-evidence
          include-hidden-files: true
          retention-days: 14
          path: |
            .surgical-refactor/artifacts/verify/verification.json
            .surgical-refactor/artifacts/verify/graph.mmd
            .surgical-refactor/artifacts/mutation/mutation.json
            .surgical-refactor/artifacts/report/REPORT.md
